name: ci

on:
  pull_request:
    branches: [develop, qa]

concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        env_file:
          - env/dev.env.example
          - env/qa.env.example
          - env/main.env.example
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose
        run: docker compose --env-file ${{ matrix.env_file }} -f deploy/compose.yml config
      - name: nginx -t
        run: |
          docker run --rm \
            -v "$PWD/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/nginx/conf.d:/etc/nginx/conf.d:ro" \
            -v "$PWD/nginx/routes:/etc/nginx/routes:ro" \
            -v "$PWD/nginx/snippets:/etc/nginx/snippets:ro" \
            nginx:1.27-alpine nginx -t
      - name: Gateway does not verify JWT
        run: |
          if grep -REi 'auth_jwt|jwt_verify|proxy_set_header X-User-Id \$[a-z]' nginx; then
            echo "gateway must not verify tokens or inject identity" >&2
            exit 1
          fi

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: compose
    steps:
      - uses: actions/checkout@v4
      - name: Health and missing-credential
        run: bash tests/smoke.sh
