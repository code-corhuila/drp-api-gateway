worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/json;
    sendfile on;
    server_tokens off;

    # Compose DNS. Variable proxy_pass needs this or NGINX dies at start
    # when identity-api is not yet running (course template 00-resolver).
    resolver 127.0.0.11 valid=10s ipv6=off;

    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    map $http_x_correlation_id $corr {
        default $http_x_correlation_id;
        ""      $request_id;
    }

    log_format gateway '$remote_addr $request $status corr=$corr';
    access_log /var/log/nginx/access.log gateway;

    include /etc/nginx/conf.d/*.conf;
}
