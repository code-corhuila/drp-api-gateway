server {
    listen 8080;
    server_name _;

    client_max_body_size 1m;

    add_header Access-Control-Allow-Origin "http://localhost:4200" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, Idempotency-Key, X-Correlation-Id" always;
    add_header Access-Control-Allow-Methods "GET, POST, PATCH, DELETE, OPTIONS" always;
    add_header X-Correlation-Id $corr always;

    error_page 401 = @err_401;
    error_page 429 = @err_429;

    location @err_401 {
        default_type application/json;
        return 401 '{"error":"UNAUTHORIZED","message":"Missing Authorization header","traceId":"$corr"}';
    }

    location @err_429 {
        default_type application/json;
        return 429 '{"error":"RATE_LIMIT_EXCEEDED","message":"Too many requests","traceId":"$corr"}';
    }

    location / {
        if ($request_method = OPTIONS) {
            add_header Content-Length 0;
            add_header Access-Control-Allow-Origin "http://localhost:4200";
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Idempotency-Key, X-Correlation-Id";
            add_header Access-Control-Allow-Methods "GET, POST, PATCH, DELETE, OPTIONS";
            return 204;
        }
        return 404 '{"error":"NOT_FOUND","message":"No gateway route","traceId":"$corr"}';
    }

    include /etc/nginx/routes/*.conf;
}
