# Must load before the /api/v1/spaces prefix (OpenAPI / ADR-006 routing).
location = /api/v1/spaces/available {
    include /etc/nginx/snippets/require-bearer.conf;
    set $upstream availability-api:8086;
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_pass http://$upstream;
}

location ~ ^/api/v1/spaces/[^/]+/availability/?$ {
    include /etc/nginx/snippets/require-bearer.conf;
    set $upstream availability-api:8086;
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_pass http://$upstream;
}
