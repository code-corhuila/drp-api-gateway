# E-04: gateway health lists upstreams. Live 503 when an upstream is down
# needs a probe the stock nginx image cannot run without a BFF (forbidden).
location = /health {
    default_type application/json;
    return 200 '{"status":"ok","service":"api-gateway","timestamp":"$time_iso8601","upstreams":{"identity-api":"8081","space-api":"8082","reservation-api":"8083","payment-api":"8084","notification-api":"8085","availability-api":"8086"}}';
}
