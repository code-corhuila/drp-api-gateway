# Public: login + JWKS. Login is the strict rate-limit zone.
location = /api/v1/auth/login {
    limit_req zone=login burst=3 nodelay;
    set $upstream identity-api:8081;
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_pass http://$upstream;
}

location = /api/v1/auth/jwks {
    set $upstream identity-api:8081;
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_pass http://$upstream;
}

location /api/v1/auth/ {
    include /etc/nginx/snippets/require-bearer.conf;
    set $upstream identity-api:8081;
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_pass http://$upstream;
}
