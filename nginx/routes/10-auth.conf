# Public: login + JWKS. Login is the strict rate-limit zone.
location = /api/v1/auth/login {
    limit_req zone=login burst=20 nodelay;
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_pass http://identity-api:8081;
}

location = /api/v1/auth/jwks {
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_pass http://identity-api:8081;
}

location /api/v1/auth/ {
    include /etc/nginx/snippets/require-bearer.conf;
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_pass http://identity-api:8081;
}
